<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffeeland FC - Prizes</title>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0807;
            color: #fdfbf7;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            font-family: 'Bebas Neue', cursive;
            font-size: 3rem;
            color: #d4af37;
        }

        .prize-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 50px;
        }

        .prize-card {
            background: #120e0b;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .prize-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .prize-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .prize-card p {
            color: #d1c7bd;
            font-size: 1rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <h1>Our Academy Prizes</h1>

    <div class="prize-container">

        <!-- Dasara Champions -->
        <div class="prize-card">
            <img src="dasara champions.jpeg" alt="Dasara Champions">
            <h3>Dasara Champions (2010 - 2024)</h3>
            <p>Consistent champions of the prestigious Chikmagalur Dasara tournament.</p>
        </div>

        <!-- C-Division Prize -->
        <div class="prize-card">
            <img src="c -divsion prize.jpeg" alt="C-Division Quarter Finalist">
            <h3>C-Division Quarter Finalist</h3>
            <p>Achieved Quarter Finalist status in the C-Division league.</p>
        </div>


    </div>

</body>

</html>
